# The hands that reach production Postgres, because the workstation cannot.
#
# A VPN adapter on the machine this repository is developed on holds the default route and
# kills the TLS handshake to 5432 before the server sees it. Every data-plane step of the move
# to Microsoft Entra authentication — reading what `sbapp` may do, creating the Entra-mapped
# roles, proving a token still works after it has expired — therefore runs here.
#
# `survey` is read-only and is the one to run when something looks wrong. It prints the shape
# of the repository secrets without printing the secrets, and it prints exactly which
# privileges the application role holds, which is the specification the Entra roles have to
# match.
name: Postgres identity

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'What to run'
        required: true
        default: survey
        type: choice
        options:
          - survey
          - provision
          - soak
  # Temporary, and removed before this branch merges: `workflow_dispatch` only offers
  # workflows that already exist on the default branch, and this one does not yet.
  push:
    branches:
      - worktree-wf_189485a3-0e7-2
      - feat/credential-free-postgres
    paths:
      - .github/workflows/postgres-entra.yml
      - infra/postgres-identity/**

permissions:
  contents: read
  # The whole point: `azure/login` exchanges this for an Azure access token against the
  # federated credential on `id-switchback-postgres-ci`. Nothing here reads a stored password.
  id-token: write

env:
  PGHOST: psql-switchback-prod-37ywppu5p7fri.postgres.database.azure.com
  PGPORT: '5432'
  PGDATABASE: switchback
  PGSSLMODE: verify-full
  PGSSLROOTCERT: /etc/ssl/certs/ca-certificates.crt
  # The Postgres role Azure creates for an ARM-declared Entra administrator is named after the
  # principal, so the CI identity's resource name is also its database username.
  PGUSER: id-switchback-postgres-ci
  AZURE_CLIENT_ID: 81c76484-bea1-4a75-8e86-2ccb3093e753
  AZURE_TENANT_ID: f0f92920-ce90-42c9-b87f-3ea8644bccd8
  # Object ids of the two application identities. Not secrets — they are in the Bicep outputs
  # and the portal — and they are what the database roles are matched against.
  FUNC_OID: 3db30cfd-ea61-47ce-9b03-8b34ebc420b0
  VERCEL_OID: c9bfba39-4191-4695-996d-a588b7154e58

# Concurrency is per job rather than per workflow. These jobs do very different things to the
# same 2-vCore Burstable server — the soak holds one idle connection for eighty minutes, the
# others open a handful for a few seconds — and a single workflow-level group would make a
# one-line fix wait out a soak.

jobs:
  survey:
    name: survey
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'survey'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: postgres-entra-survey
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest ships the PostgreSQL 16 client and production runs 17. psql itself is
      # tolerant of the skew, but the rest of this migration is not, and installing the
      # matching client once here keeps every step on one version.
      - name: Install the PostgreSQL 17 client
        run: |
          set -euo pipefail
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"

      # The two repository secrets are connection strings with a password in them. This step
      # is the only description of them anyone can get without being able to read them: it
      # prints every part except the password, and the password length rather than the
      # password. Rotating the admin credential means rewriting these secrets by hand, and
      # doing that blind is how a working deploy pipeline gets broken.
      - name: Describe the repository secrets without printing them
        env:
          POOLED_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: |
          node - <<'JS'
          const fs = require('node:fs');
          const path = require('node:path');

          function describe(label, raw) {
            if (!raw) {
              console.log(`${label}: not set`);
              return null;
            }
            let url;
            try {
              url = new URL(raw);
            } catch {
              console.log(`${label}: set, but does not parse as a URL`);
              return null;
            }
            const password = decodeURIComponent(url.password);
            if (password) console.log(`::add-mask::${password}`);
            // `new URL` strips trailing whitespace, so a secret written with a stray newline
            // parses cleanly here and then reaches Prisma — which reads the raw string — as
            // `sslmode=verify-full\n`. Setting these secrets from a pipe rather than a file
            // is the usual way to acquire one.
            if (raw !== raw.trim()) {
              console.error(`::error::${label} has leading or trailing whitespace.`);
              process.exitCode = 1;
            }
            const query = [...url.searchParams.entries()]
              .map(([k, v]) => `${k}=${v}`)
              .join('&');
            console.log(
              `${label}: ${url.protocol}//${decodeURIComponent(url.username)}:<${password.length} chars>` +
                `@${url.hostname}:${url.port || '5432'}${url.pathname}?${query}`,
            );
            return url;
          }

          describe('DATABASE_URL', process.env.POOLED_URL);
          const direct = describe('DIRECT_DATABASE_URL', process.env.DIRECT_URL);
          if (!direct) {
            console.error('::error::DIRECT_DATABASE_URL is unusable; the rest of this job needs it.');
            process.exit(1);
          }

          const host = direct.hostname;
          if (!host.endsWith('.postgres.database.azure.com')) {
            console.error(`::error::${host} is not an Azure Flexible Server.`);
            process.exit(1);
          }

          // The password reaches a 0600 passfile under the runner temp directory and nothing
          // else — not argv, not $GITHUB_ENV, not a log line.
          const port = direct.port || '5432';
          const user = decodeURIComponent(direct.username);
          const passfile = path.join(process.env.RUNNER_TEMP, 'pgpass');
          fs.writeFileSync(
            passfile,
            `${host}:${port}:*:${user}:${decodeURIComponent(direct.password)}\n`,
            { mode: 0o600 },
          );

          fs.appendFileSync(
            process.env.GITHUB_ENV,
            [
              `PGHOST=${host}`,
              `PGPORT=${port}`,
              `PGUSER=${user}`,
              `PGDATABASE=${decodeURIComponent(direct.pathname.replace(/^\//, ''))}`,
              `PGPASSFILE=${passfile}`,
              'PGSSLMODE=verify-full',
              'PGSSLROOTCERT=/etc/ssl/certs/ca-certificates.crt',
            ].join('\n') + '\n',
          );
          JS

      - name: Who am I, and over what
        run: |
          set -euo pipefail
          psql -X -tAq -v ON_ERROR_STOP=1 <<'SQL'
          SELECT 'current_user|' || current_user;
          SELECT 'session_user|' || session_user;
          SELECT 'database|' || current_database();
          SELECT 'server_version|' || current_setting('server_version');
          SELECT 'ssl|' || ssl::text || '|' || coalesce(version, '-') || '|' || coalesce(cipher, '-')
            FROM pg_stat_ssl WHERE pid = pg_backend_pid();
          SELECT 'pgaadauth_installed|' || (count(*) > 0)::text
            FROM pg_extension WHERE extname = 'pgaadauth';
          SQL

      # The specification the Entra-mapped roles have to match. Everything `sbapp` may do, in
      # a form that can be diffed against the same query run after the new roles exist: role
      # attributes, memberships, schema and table and sequence privileges, and the default
      # privileges that decide what it gets on a table `prisma db push` creates tomorrow.
      - name: Exactly what sbapp may do
        run: |
          set -euo pipefail
          psql -X -tAq -v ON_ERROR_STOP=1 <<'SQL'
          SELECT 'role|' || rolname || '|super=' || rolsuper::text || '|createdb=' || rolcreatedb::text
                 || '|createrole=' || rolcreaterole::text || '|login=' || rolcanlogin::text
                 || '|inherit=' || rolinherit::text || '|repl=' || rolreplication::text
                 || '|bypassrls=' || rolbypassrls::text
            FROM pg_roles
           WHERE rolname NOT LIKE 'pg\_%'
           ORDER BY rolname;

          SELECT 'member|' || r.rolname || '|of|' || g.rolname || '|admin=' || m.admin_option::text
            FROM pg_auth_members m
            JOIN pg_roles r ON r.oid = m.member
            JOIN pg_roles g ON g.oid = m.roleid
           WHERE r.rolname NOT LIKE 'pg\_%'
           ORDER BY r.rolname, g.rolname;

          SELECT 'schema|' || n.nspname || '|' || coalesce(array_to_string(n.nspacl, ','), '-')
            FROM pg_namespace n
           WHERE n.nspname IN ('public', 'topology')
           ORDER BY n.nspname;

          -- Collapsed to the distinct ACL shapes rather than one line per table: 20-odd
          -- tables carrying the same grant is one fact, and printing it 20 times hides the
          -- one table that differs.
          SELECT 'tblacl|' || coalesce(array_to_string(c.relacl, ','), '-') || '|tables=' || count(*)::text
            FROM pg_class c
            JOIN pg_namespace n ON n.oid = c.relnamespace
           WHERE n.nspname = 'public' AND c.relkind = 'r'
           GROUP BY c.relacl
           ORDER BY 1;

          SELECT 'seqacl|' || coalesce(array_to_string(c.relacl, ','), '-') || '|sequences=' || count(*)::text
            FROM pg_class c
            JOIN pg_namespace n ON n.oid = c.relnamespace
           WHERE n.nspname = 'public' AND c.relkind = 'S'
           GROUP BY c.relacl
           ORDER BY 1;

          SELECT 'defacl|' || pg_get_userbyid(d.defaclrole) || '|' || d.defaclobjtype::text || '|'
                 || coalesce(array_to_string(d.defaclacl, ','), '-')
            FROM pg_default_acl d
           ORDER BY 1;

          SELECT 'dbacl|' || datname || '|' || coalesce(array_to_string(datacl, ','), '-')
            FROM pg_database WHERE datname = current_database();
          SQL

  # ---------------------------------------------------------------------------------------
  # The first credential-free path. Nothing in this job reads a password: `azure/login`
  # exchanges the runner's OIDC token for an Azure one against the federated credential on
  # `id-switchback-postgres-ci`, that identity is an ARM-declared Entra administrator of the
  # server, and the access token is handed to Postgres as the password.
  # ---------------------------------------------------------------------------------------
  provision:
    name: create the Entra-mapped roles
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action == 'provision')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: postgres-entra-provision
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Install the PostgreSQL 17 client
        run: |
          set -euo pipefail
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"

      - uses: azure/login@v2
        # The federated credential this matches is declared in infra/azure/ci-identity.bicep,
        # and its subject uses GitHub's immutable `owner@id/repo@id` form because that is what
        # this repository's OIDC tokens actually carry. A credential written `owner/repo` fails
        # here with AADSTS700213 and a subject string that appears in no template.
        #
        # `allow-no-subscriptions` because this identity deliberately holds no Azure RBAC at
        # all. Its entire authority is the Postgres administrator grant in main.bicepparam, so
        # a leak of it cannot touch the resource group, the Service Bus namespace or the
        # billing. Without the flag `az login` fails with `No subscriptions found` — which
        # reads like a broken credential and is in fact the least-privilege working.
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # `oss-rdbms` is the alias for https://ossrdbms-aad.database.windows.net. The token is a
      # bearer credential with the same blast radius as the password it replaces, so it lands
      # in a 0600 passfile under the runner temp directory and is masked in the log.
      - name: Mint a database access token
        run: |
          set -euo pipefail
          token="$(az account get-access-token --tenant "$AZURE_TENANT_ID" --resource-type oss-rdbms --query accessToken -o tsv)"
          echo "::add-mask::$token"
          umask 077
          printf '%s:%s:*:%s:%s\n' "$PGHOST" "$PGPORT" "$PGUSER" "$token" > "$RUNNER_TEMP/pgpass"
          echo "PGPASSFILE=$RUNNER_TEMP/pgpass" >> "$GITHUB_ENV"

      - name: Connect with the token and nothing else
        run: |
          set -euo pipefail
          psql -X -tAq -v ON_ERROR_STOP=1 <<'SQL'
          SELECT 'current_user|' || current_user;
          SELECT 'is_admin|' || pg_has_role(current_user, 'azure_pg_admin', 'member')::text;
          SELECT 'ssl|' || version || '|' || cipher FROM pg_stat_ssl WHERE pid = pg_backend_pid();
          SQL

      - name: Create the roles
        run: |
          set -euo pipefail
          psql -X -tAq -v ON_ERROR_STOP=1 -d postgres \
            -v func_oid="$FUNC_OID" -v vercel_oid="$VERCEL_OID" \
            -f infra/postgres-identity/roles.sql
          psql -X -tAq -v ON_ERROR_STOP=1 -f infra/postgres-identity/grants.sql
          echo "roles.sql and grants.sql applied"

      # The assertion that the least-privilege claim is true rather than intended. Each new
      # role must hold exactly `sbapp`'s privileges — by membership, so this compares the
      # inherited set — and must be refused DDL.
      - name: Prove the new roles can do what sbapp does and no more
        run: |
          set -euo pipefail
          psql -X -tAq -v ON_ERROR_STOP=1 <<'SQL'
          SELECT 'attrs|' || rolname || '|super=' || rolsuper::text || '|createdb=' || rolcreatedb::text
                 || '|createrole=' || rolcreaterole::text || '|bypassrls=' || rolbypassrls::text
                 || '|login=' || rolcanlogin::text
            FROM pg_roles WHERE rolname IN ('sbapp', 'sbapp_func', 'sbapp_vercel') ORDER BY rolname;

          -- The comparison that matters: for every table in public, does each new role have
          -- exactly the privileges sbapp has? Any row here is a mismatch.
          SELECT 'MISMATCH|' || r.role || '|' || t.relname || '|' || p.priv
            FROM pg_class t
            JOIN pg_namespace n ON n.oid = t.relnamespace
           CROSS JOIN (VALUES ('sbapp_func'), ('sbapp_vercel')) AS r(role)
           CROSS JOIN (VALUES ('SELECT'), ('INSERT'), ('UPDATE'), ('DELETE'),
                              ('TRUNCATE'), ('REFERENCES'), ('TRIGGER')) AS p(priv)
           WHERE n.nspname = 'public' AND t.relkind = 'r'
             AND has_table_privilege(r.role, t.oid, p.priv)
                 <> has_table_privilege('sbapp', t.oid, p.priv);

          SELECT 'create_on_public|' || rolname || '|'
                 || has_schema_privilege(rolname, 'public', 'CREATE')::text
            FROM pg_roles WHERE rolname IN ('sbapp', 'sbapp_func', 'sbapp_vercel') ORDER BY rolname;
          SQL

      - name: List what Azure thinks is Entra-mapped
        run: |
          set -euo pipefail
          psql -X -tAq -v ON_ERROR_STOP=1 -d postgres <<'SQL'
          SELECT 'entra|' || row_to_json(p)::text
            FROM pg_catalog.pgaadauth_list_principals(false) p ORDER BY 1;
          SQL

      # A privilege check that reads well is not the same as a privilege that is enforced.
      # This asks the server, as the role, and expects to be refused.
      - name: Refuse DDL, out loud
        run: |
          set -euo pipefail
          if psql -X -q -v ON_ERROR_STOP=1 \
               -c "SET ROLE sbapp_func" \
               -c "CREATE TABLE ddl_probe_should_fail (id int)" 2> "$RUNNER_TEMP/ddl.err"; then
            echo "::error::sbapp_func created a table. It is not least-privilege."
            psql -X -q -c "DROP TABLE IF EXISTS ddl_probe_should_fail"
            exit 1
          fi
          grep -q 'permission denied' "$RUNNER_TEMP/ddl.err" \
            || { echo "::error::CREATE TABLE failed for the wrong reason:"; cat "$RUNNER_TEMP/ddl.err"; exit 1; }
          sed 's/^/refused: /' "$RUNNER_TEMP/ddl.err"

  # ---------------------------------------------------------------------------------------
  # Does an established session die when its token expires?
  #
  # **This job does not currently answer that, and the reason is worth keeping.** It was built
  # against the documented user-token lifetime of one hour and holds a connection for eighty
  # minutes. Run 31049068312 held backend pid 844034 from 21:32:50 to 22:52:53 UTC — same pid,
  # same role, sixteen probes, no error — and proved nothing about expiry, because the token it
  # authenticated with printed `lifetime=1440min`. A managed identity gets **24 hours**, not one
  # hour, so eighty minutes is comfortably inside the window. A test that cannot fail is not a
  # test.
  #
  # A GitHub-hosted job is capped at six hours, so waiting the token out here is not available.
  # Two designs that would work, neither yet tried: shorten the lifetime with an Entra token
  # lifetime policy on this identity's service principal, or hold the connection from something
  # without a six-hour cap. Until one of them runs, the token lifecycle in docs/architecture.md
  # says the question is open, and it should keep saying so.
  #
  # What the job does establish, and it is not nothing: a token-authenticated session is stable
  # for eighty minutes on the same backend, so the connection is not being cycled underneath us
  # by anything else.
  # ---------------------------------------------------------------------------------------
  soak:
    name: hold a connection past token expiry
    # Dispatch only. Eighty minutes is too long to spend on every push, and the one execution
    # this branch needed was fired by the temporary push trigger above before this line.
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'soak'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    concurrency:
      group: postgres-entra-soak
      cancel-in-progress: false

    steps:
      - name: Install the PostgreSQL 17 client
        run: |
          set -euo pipefail
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"

      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Mint a database access token
        run: |
          set -euo pipefail
          token="$(az account get-access-token --tenant "$AZURE_TENANT_ID" --resource-type oss-rdbms --query accessToken -o tsv)"
          echo "::add-mask::$token"
          umask 077
          printf '%s:%s:*:%s:%s\n' "$PGHOST" "$PGPORT" "$PGUSER" "$token" > "$RUNNER_TEMP/pgpass"
          echo "PGPASSFILE=$RUNNER_TEMP/pgpass" >> "$GITHUB_ENV"
          # The `exp` claim, read rather than assumed. Base64url, so the alphabet is translated
          # before decoding.
          node -e '
            const part = process.argv[1].split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
            const claims = JSON.parse(Buffer.from(part, "base64").toString());
            const left = claims.exp - Math.floor(Date.now() / 1000);
            const mins = Math.round(left / 60);
            console.log(`exp=${new Date(claims.exp * 1000).toISOString()} lifetime=${mins}min aud=${claims.aud}`);
            require("node:fs").appendFileSync(process.env.GITHUB_ENV, `TOKEN_LIFETIME_MIN=${mins}\n`);
          ' "$token"

      - name: One session, eighty minutes
        run: |
          set -euo pipefail
          {
            echo "SELECT 'start|' || now()::text || '|pid=' || pg_backend_pid()::text;"
            for i in $(seq 1 16); do
              echo "SELECT pg_sleep(300);"
              echo "SELECT 'probe|$i|' || now()::text || '|pid=' || pg_backend_pid()::text || '|user=' || current_user;"
            done
          } > "$RUNNER_TEMP/soak.sql"
          psql -X -tAq -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/soak.sql" | grep -v '^$'

      # Says out loud whether the run above could have failed. Without this the log reads as a
      # clean pass on a question it never asked.
      - name: Did this actually cross the expiry boundary?
        run: |
          set -euo pipefail
          if [ "${TOKEN_LIFETIME_MIN:-0}" -gt 80 ]; then
            echo "::warning::INCONCLUSIVE — the token was valid for ${TOKEN_LIFETIME_MIN} minutes and this job held the session for 80. Nothing here says what happens at expiry."
          else
            echo "Conclusive: the session outlived a token valid for ${TOKEN_LIFETIME_MIN} minutes."
          fi
