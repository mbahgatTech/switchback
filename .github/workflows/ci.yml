# The gates that can run on someone else's machine — and the deploy they guard.
#
# Four of the five gates are hermetic — format:check, typecheck, lint and vitest touch
# nothing outside the repo — so they run on every push and every pull request. The browser
# suite is not, and the reason is worth stating rather than working around.
#
# `e2e/` opens a real browser against a real Postgres holding real OpenStreetMap data for
# the Vesper Peak sheet. Nothing about it is mockable without defeating its purpose: it
# exists because a component rendered twenty trails in its props and painted an empty map,
# and a fixtured version would have passed. But `npm run db:seed` only *queues* the ingest
# tiles; filling them means querying a public Overpass instance, and doing that on every
# push would make this repository exactly the kind of automated client that gets a project
# blocked — the same behaviour `packages/ingest/overpass.ts` is built to avoid. It would
# also make CI red for weather timeouts rather than for defects.
#
# So the browser suite runs nightly and on demand: one z9 tile, once a day, which is well
# inside any fair-use reading. Contributors run it locally, where the tile is already there.
#
# That one tile is also why `packages/db/scripts/seed-e2e.ts` exists. Three specs open trails
# outside it and none is about the pipeline — one is about what a browser draws when an image
# file 404s, one about SVG labels overprinting, one about filing a report — so they take offline
# fixtures rather than a second, third and fourth Overpass query. Everything that *is* about the
# pipeline still reads the ingested tile, where a fixtured version would indeed have passed.
#
# Which trail belongs to which of those two is a declaration, in `e2e/trails.ts`, and
# `test/e2e-trail-sources.test.ts` holds it to this file — in `gates`, so a trail this workflow
# cannot produce fails a pull request rather than the next nightly run. It also reads `e2e/` for
# slugs written straight into a `page.goto`, which no declaration would otherwise cover; one is
# exempt by a marked comment, because its subject is a trail the database must not hold.
#
# ---------------------------------------------------------------------------------------
#
# **How production gets deployed, and why it looks like this.**
#
# The Vercel project is connected to this repository, so out of the box every push to
# `master` deployed straight to production whether or not the gates passed. That is a
# deployment mechanism, not a pipeline: the one thing a pipeline has to be able to do is
# refuse. So `apps/web/vercel.json` sets `git.deploymentEnabled.master: false`, which turns
# off the automatic production build, and the `deploy` job below triggers it instead — after
# `gates` is green, and only then. Pull requests keep their automatic preview deployments,
# because a preview is a throwaway URL nobody is relying on and having one to look at while
# reviewing is worth more than the purity.
#
# The trigger is a **deploy hook** rather than `vercel deploy --prod`, and that is forced
# rather than chosen. A CLI deploy needs a Vercel API token; Vercel refuses to mint one from
# a CLI-issued credential ("Cannot create tokens for this app"), so the only token that could
# go in `VERCEL_TOKEN` is one a human makes by hand in the dashboard. A deploy hook is a
# project-scoped URL that can be created through the API, which means this pipeline could be
# built end to end without leaving a manual step in the middle of it. The trade is that a
# hook is fire-and-forget: it returns a job id and tells you nothing further.
#
# The two settings do not collide, which is worth writing down because it looks like they
# should. `git.deploymentEnabled` gates deployments "upon commits" — the Git integration's
# push path, and nothing else. The setting that stops a hook firing is the deprecated
# `github.enabled: false`, which this project does not set and must not.
#
# A hook deploys the *tip of its branch* at the moment it is called, not the commit that
# called it. Two pushes in quick succession would therefore have the first job polling for a
# SHA the second one just replaced — which is why `cancel-in-progress` above is load-bearing
# rather than a nicety: the superseded run is cancelled before it can wait twenty minutes to
# fail at something that is not a defect.
#
# Hence `/api/version`. The job polls the production alias until it reports back the SHA that
# was pushed. That is a better check than the deployment record it replaces — it proves the
# build finished, the alias moved, *and* the app can serve a request, rather than proving a
# row somewhere reads READY.
#
# ---------------------------------------------------------------------------------------
#
# **Everything reaches master through a pull request**, and the `deploy` job is where that
# is enforced rather than merely intended. The obvious place would be a branch ruleset, but
# rulesets and branch protection need GitHub Pro on a private repository and this one is
# private on the free plan — so the rule would have been a note in a README that the next
# person in a hurry ignores. Refusing to deploy is enforcement the free plan cannot switch
# off: push straight to master and the gates still run, but nothing ships.
#
# That check needs `pull-requests: read` named explicitly on its job. This repository's
# default token permission is "read", which reads like it grants read everywhere and does
# not — it is GitHub's restricted default, `contents` and `packages` only. Asking for the
# pull requests of a commit without the scope returns 403 "Resource not accessible by
# integration", which is a sentence about permissions wearing the costume of a verdict.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # 04:11 UTC. Off the hour on purpose — every scheduled workflow on the platform fires at
    # :00, and the queue at that minute is where a five-minute job waits twenty.
    - cron: '11 4 * * *'
  workflow_dispatch:

# Keyed by event as well as ref, because the browser suite runs only on `schedule` or
# `workflow_dispatch` (see the note at the top) — so the one action that verifies Playwright was
# the one action that cancelled an in-flight deploy on the same ref. It happened: a dispatch two
# minutes after a merge killed that merge's `production schema` and `deploy production`, and left
# production a commit behind master.
#
# `cancel-in-progress` stays on, and stays on for master especially: the note below on the deploy
# hook explains that a hook ships the tip of its branch rather than the commit that called it, so a
# superseded run polls `/api/version` for a SHA that no longer exists. Cancelling it is the point.
# Adding the event to the key keeps that behaviour between two pushes while stopping a dispatch
# from reaching a push at all.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  # A local throwaway database and a throwaway secret. Neither is a credential to anything.
  #
  # There is no `.env` file here and none is written. Every db script runs under
  # `dotenv -e ../../.env`, which is a no-op when the file is absent, and dotenv never
  # overrides a variable that is already set — so these pass straight through. The vitest
  # config reads the same way (`loadEnv` with an empty prefix merges `process.env` last).
  DATABASE_URL: postgresql://switchback:switchback@localhost:5433/switchback
  # Same endpoint. The two only diverge where a connection pooler sits in front of the database
  # and cannot carry DDL; `prisma db push` reads `directUrl` and fails on a missing variable,
  # not an equal one.
  DIRECT_DATABASE_URL: postgresql://switchback:switchback@localhost:5433/switchback
  AUTH_SECRET: ci-secret-not-used-for-anything-real-0123456789
  # Overpass refuses a client that will not say who it is, and rightly. A CI run that ever
  # reaches it should be identifiable and reachable.
  OVERPASS_USER_AGENT: 'switchback-ci/0.1 (+https://github.com/${{ github.repository }})'

jobs:
  gates:
    name: format · typecheck · lint · unit
    runs-on: ubuntu-latest

    env:
      # `eslint .` runs the type-aware rules, so it holds a TypeScript program for the whole
      # monorepo in memory at once. That peaks just under V8's default old-space cap on the
      # Node 22 this job pins, which puts it on the wrong side of the line as soon as a branch
      # adds files: the step aborts with "Reached heap limit" and exit 134. That reads like a
      # lint failure and is not one — it reports no rule and no file, and the same tree lints
      # clean under a larger cap. Nothing is relaxed here; `--max-warnings=0` still holds.
      # The pass is only given room to finish, on a runner with 16 GB to spare.
      NODE_OPTIONS: --max-old-space-size=4096

    services:
      db:
        # The same image infra/docker-compose.yml uses. Postgres 17 matches production; PostGIS
        # does not — production is Azure, which ships 3.6.1, and this is 3.5. That skew is
        # recorded rather than papered over. A CI database on plain Postgres would pass every
        # test that does not touch PostGIS and fail the ones that matter.
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: switchback
          POSTGRES_PASSWORD: switchback
          POSTGRES_DB: switchback
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U switchback -d switchback"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the engines floor in package.json, which is React Native 0.86's. With
          # engine-strict=true in .npmrc, a mismatch fails the install rather than Metro.
          node-version: 22
          cache: npm

      - run: npm ci

      # First, because it needs nothing else — no database, no generated client, no build.
      # A formatting failure that waits behind four minutes of Postgres and tsc is a
      # four-minute wait to be told about a missing newline.
      - run: npm run format:check

      # Explicit rather than trusting @prisma/client's postinstall to find the schema from
      # a hoisted workspace root. Everything downstream imports the generated types, so
      # skipping this fails typecheck with an error about the wrong thing entirely.
      - run: npm run db:generate

      # `push` also applies packages/db/prisma/spatial.sql — the indexes and the check
      # constraints Prisma cannot express live there, and half the db tests assert on them.
      - run: npm run db:push

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  # The gates above assert what a Mermaid block *says*; this asserts what a reader *gets*. GitHub
  # renders each block with its own Mermaid build inside a sandboxed iframe, and answers a parse
  # failure by printing the source — visible to anyone reading the file, invisible to every check
  # that does not load the page. A misspelt directive is the construct measured to do it.
  mermaid:
    name: mermaid renders on github
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The script reads github.com, so it needs a commit that is already there under this
    # repository's URL. `github.sha` on a pull request is the ephemeral merge commit, which has no
    # blob page; the head commit does. A pull request from a fork has neither, so it is skipped
    # rather than failed — nothing at this URL could render it, and a red check about the URL
    # rather than the change is the habit this job exists to prevent.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `chromium` installs Chrome for Testing *and* the headless shell, and `chromium.launch()`
      # takes the shell. The shell does mount the cross-origin iframe GitHub renders Mermaid in —
      # run 31307574351 rendered all twelve blocks on it in 68 s.
      - run: npx playwright install --with-deps chromium

      - name: Every block became a diagram, on the site
        env:
          REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npx tsx scripts/check-mermaid-github.ts "$REF"

  worker:
    name: ingest worker bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # `id-token` for the subject check below, which asks GitHub for a token and reads its `sub`.
    # Naming any permission replaces the default set, so `contents` is restated for the checkout.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      # Before anything expensive, and on every push and pull request rather than only on the
      # deploys that need it. The `deploy ingest worker` job below is gated on master, so a
      # subject that stops matching would first appear as a red master with the Function App
      # still on the last build a human pushed — which is the whole of B1, restored.
      - name: The deploy credential still matches the subject GitHub issues
        run: bash .github/scripts/assert-oidc-subject.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The bundle copies the generated client out of node_modules rather than regenerating it,
      # so this is a prerequisite and not a convenience — `scripts/bundle.ts` throws by name
      # without it. `binaryTargets` in the schema is what puts the Linux engine in that copy.
      - run: npm run db:generate

      # Produces `dist/` complete: bundle, `dist/package.json`, `npm install --omit=dev`, and
      # only then the generated Prisma client. That order is the fix for the artefact that
      # mounted perfectly and reported "0 functions found"; see the note in scripts/bundle.ts.
      - run: npm run build --workspace=@switchback/ingest-worker

      - name: Package
        working-directory: apps/ingest-worker/dist
        run: zip -qr "$RUNNER_TEMP/ingest-worker.zip" .

      # **Loaded from an extracted copy of the zip, outside the repository.** The previous
      # version of this step ran `require('./index.js')` in `apps/ingest-worker/dist`, which is
      # inside the monorepo — so Node walked up to the workspace root's `node_modules` and
      # resolved every external from there. It passed against an artefact whose
      # `node_modules/@prisma/` was an empty directory. Nothing up the tree from `$RUNNER_TEMP`
      # holds a `node_modules`, which the loop below asserts rather than assumes, so this can
      # only resolve what the zip actually contains.
      - name: Load the packaged entry point from outside the monorepo
        run: |
          rm -rf "$RUNNER_TEMP/verify"
          mkdir -p "$RUNNER_TEMP/verify"
          unzip -q "$RUNNER_TEMP/ingest-worker.zip" -d "$RUNNER_TEMP/verify"

          dir="$RUNNER_TEMP/verify"
          while [ "$dir" != "/" ]; do
            parent=$(dirname "$dir")
            if [ -d "$parent/node_modules" ]; then
              echo "::error::$parent/node_modules could rescue a missing dependency — this check would prove nothing."
              exit 1
            fi
            dir="$parent"
          done

          test -f "$RUNNER_TEMP/verify/node_modules/@prisma/client/package.json" || {
            echo "::error::the zip has no @prisma/client — the bundle pruned it again."
            exit 1
          }

          ls "$RUNNER_TEMP"/verify/node_modules/.prisma/client/libquery_engine-*.so.node >/dev/null || {
            echo "::error::the zip has no Linux query engine — @prisma/client is present but cannot run."
            exit 1
          }

          cd "$RUNNER_TEMP/verify"
          node -e "require('./index.js'); console.log('worker entry point loaded from the zip')"

          # `require` alone never asks Prisma for its engine, so a bundle carrying the wrong
          # platform's binary would pass the line above and die on the worker's first query.
          # `$connect` against a closed port loads the engine and then fails on the network,
          # which is the one failure this step accepts.
          node -e "
            const { PrismaClient } = require('@prisma/client');
            new PrismaClient({ datasources: { db: { url: 'postgresql://u:p@127.0.0.1:1/none' } } })
              .\$connect()
              .then(
                () => { console.error('unexpected: connected to a closed port'); process.exit(1); },
                (error) => {
                  const message = String(error && error.message);
                  if (/engine|\.so\.node|platform/i.test(message)) {
                    console.error('::error::Prisma could not load its query engine from the zip');
                    console.error(message);
                    process.exit(1);
                  }
                  console.log('PrismaClient loaded its query engine from the zip');
                },
              );
          "

      - uses: actions/upload-artifact@v4
        with:
          name: ingest-worker
          path: ${{ runner.temp }}/ingest-worker.zip
          retention-days: 14

  # The job above builds a bundle and proves it loads. Until this one existed, nothing published
  # it: `WEBSITE_RUN_FROM_PACKAGE` was written only by a workstation, so master could move for
  # weeks while the Function App served whatever zip a human last pushed — with every gate green,
  # because a green gate is a statement about a build and not about production.
  #
  # `needs` lists all three. `gates` so a bundle that compiles but fails the unit suite does not
  # ship; `worker` for the artifact; `migrate` because the worker reads the same schema the web app
  # does, so a column it expects has to exist before the code expecting it runs. That ordering is
  # pinned by `test/worker-deploy-path.test.ts` — dropping `migrate` from this list is how code
  # reaches production ahead of the schema it needs.
  #
  # **No `environment:`.** Naming one replaces the `:ref:refs/heads/master` suffix of the OIDC
  # subject with `:environment:<name>`, which this job's federated credential does not match — and
  # the `production` environment carries no protection rules (`gh api
  # repos/mbahgatTech/switchback/environments` returns `protection_rules: []`), so it would have
  # bought a deployment record at the cost of the credential. The gate that matters here is the
  # `if:` below plus the deploy check in ci.yml's `deploy` job: nothing reaches master except
  # through a pull request.
  worker-deploy:
    name: deploy ingest worker
    needs: [gates, worker, migrate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ingest-worker
          path: ${{ runner.temp }}

      # A distinct identity from the two this repository already federates. `id-switchback-postgres-ci`
      # holds no Azure RBAC by design and could not deploy anything; the infrastructure identity,
      # once `grantInfraIdentityContributor` is on, is Contributor on the whole subscription —
      # `infraContributor` in main.bicep declares no `scope`, so it takes that template's
      # `targetScope`, and a resource group is not a boundary on it. This one holds three narrow grants — Website
      # Contributor on the one site, Monitoring Reader on the one Application Insights component,
      # and Storage Blob Data Contributor on the one `function-releases` container — enough to
      # upload a package, point the app at it and read back whether the host is running it, and
      # nothing else.
      #
      # Declared in `infra/azure/ingest.bicep` as `workerDeployer`, whose `workerDeployerClientId`
      # output is what belongs in this variable.
      - name: Fail loudly rather than skip
        if: vars.AZURE_WORKER_DEPLOY_CLIENT_ID == '' || vars.AZURE_SUBSCRIPTION_ID == ''
        run: |
          echo "::error::AZURE_WORKER_DEPLOY_CLIENT_ID or AZURE_SUBSCRIPTION_ID is unset, so this"
          echo "::error::push builds a worker bundle that reaches nothing. Deploy ingest.bicep and"
          echo "::error::set both repository variables from its outputs. A skipped deploy job is"
          echo "::error::how the Function App came to run a build five weeks older than master."
          exit 1

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_WORKER_DEPLOY_CLIENT_ID }}
          tenant-id: f0f92920-ce90-42c9-b87f-3ea8644bccd8
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Not preinstalled on `ubuntu-latest`, and the deploy proof is an Application Insights query.
      # Installing it explicitly rather than letting `az` offer a dynamic install: that prompt is
      # declined in a non-interactive shell, and the query would then fail in a way the script
      # cannot distinguish from a host that never started.
      - name: Install the Application Insights CLI extension
        run: az extension add --name application-insights --only-show-errors

      # Publishes, syncs the trigger cache, and then waits for the running host to emit a heartbeat
      # carrying *this commit's* SHA. It fails if the package did not change or if that line does
      # not arrive — an exit code from the push alone reported every stale deploy as a success, and
      # a marker without the SHA would pass on any build that already had the current health.ts.
      - name: Publish the bundle and prove the host is running it
        run: bash .github/scripts/deploy-worker.sh "$RUNNER_TEMP/ingest-worker.zip" "$GITHUB_SHA"

  browser:
    name: browser suite
    # Nightly and on demand only — see the note at the top of this file.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: switchback
          POSTGRES_PASSWORD: switchback
          POSTGRES_DB: switchback
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U switchback -d switchback"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:push

      # Creates the probe account the signed-in specs use, and queues the starter tiles.
      - run: npm run db:seed

      # Three trails the suite opens by slug that the one tile below does not contain — a gallery
      # whose photographs 404 on purpose, a long route whose high point comes early enough that
      # the section's weather callouts fight for room, and the trail the reports are filed
      # against. All are offline fixtures under reserved `fixture-` slugs; `e2e-shapes.ts`
      # explains why they are invented rather than ingested. Without this step six cases fail on
      # every run regardless of the commit.
      - name: Seed the browser suite's fixtures
        run: npm run db:seed:e2e

      # The one Overpass query this workflow makes. Vesper Peak, because that is the sheet
      # every spec opens on — the reader's original report was "I search Vesper peak and get
      # nothing", and the suite was written to keep that fixed.
      - name: Ingest the Vesper Peak tile
        run: npm run ingest:tile -- --at 48.01213,-121.51188

      # The full Chromium build, not the headless shell: playwright.config.ts sets
      # `channel: 'chromium'` because MapLibre throws without a WebGL2 context and the shell
      # cannot give it one even with SwiftShader.
      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # ---------------------------------------------------------------------------------------
  # Production. Only ever reached from `master`, and only ever behind green gates.
  # ---------------------------------------------------------------------------------------

  migrate:
    name: production schema
    needs: gates
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # `id-token` is what makes this job credential-free: the runner mints an OIDC assertion,
    # `azure/login` trades it for an Azure token against the federated credential on
    # `id-switchback-postgres-ci`, and that token is the database password. Naming any
    # permission replaces the default set, so `contents` is restated for the checkout.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, because the step below compares against the commit master was at
          # before this push. A shallow clone has that commit only when the push was one deep.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `github.event.before`, not `HEAD^`: a push carries however many commits its merge
      # strategy produced, and a rebase merge lands every commit of a pull request. `HEAD^ HEAD`
      # would then see only the last of them and miss a schema change made in any other, which
      # ships code expecting a column the database was never given. Logic and its cases are in
      # `scripts/schema-changed.ts` and `test/schema-changed.test.ts`.
      - name: Did the schema change?
        id: schema
        run: npx tsx scripts/schema-changed.ts "${{ github.event.before }}" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      # Unconditional, unlike the push below: the grant convergence at the end of this job has to
      # run whether or not this commit touched the schema, because the database it repairs drifted
      # under an earlier one.
      - uses: azure/login@v2
        # The same identity and the same federated credential `postgres-entra.yml` uses, and
        # for the same reason: it holds no Azure RBAC at all, so `allow-no-subscriptions` is
        # the least privilege working rather than a broken credential.
        with:
          client-id: 81c76484-bea1-4a75-8e86-2ccb3093e753
          tenant-id: f0f92920-ce90-42c9-b87f-3ea8644bccd8
          allow-no-subscriptions: true

      # The Prisma CLI has no driver-adapter seam — `db push` reads a connection *string* off
      # `schema.prisma`'s `url` and `directUrl`, so the token provider in packages/db cannot
      # serve it. A token is a string, though, so it goes in the password field.
      #
      # Minted inside each step that needs it rather than exported once to `$GITHUB_ENV`. This
      # token authenticates `id-switchback-postgres-ci`, a full Postgres administrator; putting
      # it in the job environment hands it to every later step and to every process they start,
      # for a credential that only two steps have any use for. `::add-mask::` redacts the log,
      # not the environment.
      #
      # Both variables, not one: `prisma db push` reads `directUrl` and
      # `packages/db/scripts/apply-spatial.ts` constructs its own client from `DATABASE_URL`.
      - name: Prove the token connects, and as an administrator
        if: steps.schema.outputs.changed == 'true'
        env:
          PGHOST: psql-switchback-prod-37ywppu5p7fri.postgres.database.azure.com
          PGUSER: id-switchback-postgres-ci
          PGDATABASE: switchback
        run: |
          set -euo pipefail
          . ./.github/scripts/pg-token-url.sh
          # Local, pinned and already installed by `npm ci`. `npx --yes` would resolve tsx and
          # its whole dependency closure from the registry at job time, unpinned, into a process
          # holding an administrator credential for the production database.
          #
          # A file, never `tsx -e`. Inline, esbuild's output format is CommonJS and the probe's
          # `await`s are rejected before a line of it runs; `scripts/assert-pg-admin.ts` explains
          # the whole trap, and `test/ci-steps-runnable.test.ts` executes what this line invokes.
          ./node_modules/.bin/tsx scripts/assert-pg-admin.ts

      - if: steps.schema.outputs.changed == 'true'
        run: npm run db:generate

      # No `--accept-data-loss`, deliberately. Prisma refuses a destructive reconciliation
      # without it and cannot prompt in CI, so a change that would drop a column fails this
      # job — and therefore blocks the deploy — instead of quietly executing against the one
      # database with real data in it. Making that change is then a manual, deliberate act.
      - if: steps.schema.outputs.changed == 'true'
        name: Reconcile the production schema
        env:
          PGHOST: psql-switchback-prod-37ywppu5p7fri.postgres.database.azure.com
          PGUSER: id-switchback-postgres-ci
          PGDATABASE: switchback
        run: |
          set -euo pipefail
          . ./.github/scripts/pg-token-url.sh
          npm run db:push

      # After the push, so the tables it created exist to be granted on, and unconditional, so a
      # database that is already short converges rather than waiting for the next new table.
      #
      # `ALTER DEFAULT PRIVILEGES` is registered per creating role. This job pushes as
      # `id-switchback-postgres-ci` and the only registration in the database was
      # `FOR ROLE sbadmin`, so `trail_ways` and `trail_slug_aliases` reached production with no
      # privilege for `sbapp` at all — which is what made `INGEST_TRAIL_IDENTITY=claim`
      # unreachable there. The script explains the mechanism and asserts the outcome.
      - name: Converge the runtime role's grants
        env:
          PGHOST: psql-switchback-prod-37ywppu5p7fri.postgres.database.azure.com
          PGUSER: id-switchback-postgres-ci
          PGDATABASE: switchback
        run: |
          set -euo pipefail
          . ./.github/scripts/pg-token-url.sh
          ./node_modules/.bin/tsx scripts/converge-runtime-grants.ts

  deploy:
    name: deploy production
    needs: [gates, migrate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Naming any permission replaces the default set rather than adding to it, so `contents`
    # is restated even though nothing here checks out — a later step that does would
    # otherwise fail for a reason nobody would look for in this block.
    permissions:
      contents: read
      pull-requests: read

    # Shows up as a deployment on the commit, with a link, and gives somewhere to hang a
    # required reviewer later without touching this file.
    environment:
      name: production
      url: https://switchback-three.vercel.app

    steps:
      # The pull-request rule, enforced at the only point where enforcement is free.
      #
      # The association is queried rather than read off the commit message, because a squash
      # merge leaves a subject line indistinguishable from a direct commit — inferring it
      # from text would pass exactly the pushes it exists to catch. GitHub takes a moment to
      # index a freshly merged commit, so a single call would fail honest merges; hence the
      # retry.
      #
      # A failed *call* and an empty *answer* are kept apart, because the first version of
      # this step ran them together and refused its own merge commit: the API was returning
      # 403 for a missing scope and `|| echo 0` was reading that as "no pull request". A
      # check that cannot tell "you skipped review" from "I could not ask" is not a check,
      # so anything that is not a clean count now fails immediately and says which it was.
      # The unreadable-count branch is the same guard one layer down — an absent or unhappy
      # `jq` produces empty output, and empty compares as zero if you let it.
      - name: Refuse a commit that did not arrive through a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if ! body=$(gh api "repos/$REPO/commits/$SHA/pulls" 2>&1); then
              echo "::error::Could not ask GitHub which pull request this commit came from."
              echo "::error::This is not a verdict on the commit — the lookup itself failed:"
              printf '%s\n' "$body"
              exit 1
            fi

            count=$(printf '%s' "$body" | jq 'length' 2>&1)
            case "$count" in
              '' | *[!0-9]*)
                echo "::error::Could not count the pull requests GitHub returned."
                echo "::error::This is not a verdict on the commit — reading the reply failed:"
                printf '%s\n' "$count"
                exit 1
                ;;
            esac

            if [ "$count" -gt 0 ]; then
              printf '%s' "$body" | jq -r '.[] | "From #\(.number): \(.title)"'
              exit 0
            fi

            echo "attempt $attempt — GitHub reports no pull request for this commit yet"
            sleep 10
          done

          echo "::error::$SHA was pushed straight to master, so it will not be deployed."
          echo "::error::Branch it and open a pull request:"
          echo "::error::  git switch -c <branch> && git push -u origin <branch> && gh pr create"
          exit 1

      # A hook is a URL and the URL is the credential, so it is passed through the environment
      # rather than interpolated into the command line, where it would be visible to anything
      # reading the process table on the runner. GitHub masks it in the log either way.
      - name: Trigger the Vercel build
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK is not set. See the note at the top of this file."
            exit 1
          fi
          status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$DEPLOY_HOOK")
          echo "Deploy hook returned $status"
          [ "$status" = "201" ] || [ "$status" = "200" ]

      # The hook returns a job id and nothing else, so liveness is confirmed from the outside:
      # poll the production alias until it reports the commit that was just pushed. This is
      # deliberately end-to-end — it clears only when the build has finished, the alias has
      # moved, and the running app can answer a request.
      - name: Wait for the alias to serve this commit
        env:
          SITE: https://switchback-three.vercel.app
          SHA: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 90); do
            body=$(curl -fsS --max-time 20 "$SITE/api/version" 2>/dev/null || true)
            live=$(printf '%s' "$body" | jq -r '.commit // empty' 2>/dev/null || true)
            where=$(printf '%s' "$body" | jq -r '.environment // empty' 2>/dev/null || true)

            if [ "$live" = "$SHA" ] && [ "$where" = "production" ]; then
              echo "Live: $SHA"
              exit 0
            fi

            # Every tenth attempt, so a stuck deploy is diagnosable from the log without the
            # log being ninety lines of the same sentence.
            if [ $((attempt % 10)) -eq 1 ]; then
              echo "attempt $attempt — serving ${live:-<nothing>} (${where:-unknown}), want $SHA"
            fi
            sleep 10
          done

          echo "::error::The production alias never reported $SHA. The build may have failed —"
          echo "::error::check the Vercel dashboard for this project."
          exit 1

      # A smoke test, because "the alias moved" and "the site works" are different claims and
      # only one of them has been proven so far.
      #
      # **Every assertion here has to be one the architecture guarantees on an empty corpus.**
      # Ingestion is on demand — nothing is seeded, tiles fill when a reader opens ground — so a
      # route naming one trail asserts a fact about history rather than about the deployment. This
      # list held `/trails/llanberis-path` until the production corpus was wiped, and then failed
      # run 31301084801 against a web tier that had deployed perfectly: all five other routes 200,
      # `/api/version` reporting the pushed commit, and one 404 that was the correct answer.
      #
      # What the design does promise is that the site serves its own pages and that a trail lookup
      # reaches Postgres, so those are what this asserts. The 404 is the second one: `trails.bySlug`
      # queries `trails` and falls through to `trail_slug_aliases`, so an unreachable schema is a
      # 500 and only a schema that answered "no such row" is a 404.
      #
      # The other two halves of "production is healthy" are proven upstream and not repeated here —
      # that this commit is the one serving, by the alias poll above; that the worker is running
      # this build, by the heartbeat `deploy ingest worker` waits for. Neither belongs in a curl
      # loop, and the second has no Azure credential on this job to ask with.
      #
      # No `-L`, deliberately. `%{http_code}` reports the first response, so a redirect anywhere
      # in this list fails the job — which is the point: `/explore` must serve the sheet itself
      # rather than bounce a shared link through an extra round trip.
      - name: Smoke-test the live site
        env:
          SITE: https://switchback-three.vercel.app
        run: |
          failed=0
          check() {
            status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$SITE$2" || echo 000)
            printf '%s  want %s  %s\n' "$status" "$1" "$2"
            [ "$status" = "$1" ] || failed=1
          }

          # The map that is now the front page, the alias every shared link still carries, the
          # list of trails near the reader, the attribution ODbL requires, and the manifest
          # without which none of it installs.
          for path in / /explore /nearby /attribution /manifest.webmanifest; do
            check 200 "$path"
          done

          # A slug carried by no OpenStreetMap feature, so the lookup misses whatever has been
          # ingested. Asserting the miss rather than a hit is what makes this hold the day after a
          # wipe and the day after a full re-ingest.
          check 404 /trails/switchback-smoke-test-no-such-trail

          [ "$failed" -eq 0 ] || {
            echo "::error::A production route did not answer as the design requires."
            exit 1
          }
