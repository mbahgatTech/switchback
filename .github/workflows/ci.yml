# The gates that can run on someone else's machine — and the deploy they guard.
#
# Four of the five gates are hermetic — format:check, typecheck, lint and vitest touch
# nothing outside the repo — so they run on every push and every pull request. The browser
# suite is not, and the reason is worth stating rather than working around.
#
# `e2e/` opens a real browser against a real Postgres holding real OpenStreetMap data for
# the Vesper Peak sheet. Nothing about it is mockable without defeating its purpose: it
# exists because a component rendered twenty trails in its props and painted an empty map,
# and a fixtured version would have passed. But `npm run db:seed` only *queues* the ingest
# tiles; filling them means querying a public Overpass instance, and doing that on every
# push would make this repository exactly the kind of automated client that gets a project
# blocked — the same behaviour `packages/ingest/overpass.ts` is built to avoid. It would
# also make CI red for weather timeouts rather than for defects.
#
# So the browser suite runs nightly and on demand: one z9 tile, once a day, which is well
# inside any fair-use reading. Contributors run it locally, where the tile is already there.
#
# That one tile is also why `packages/db/scripts/seed-e2e.ts` exists. Two specs open trails
# outside it and neither is about the pipeline — one is about what a browser draws when an
# image file 404s, the other about SVG labels overprinting — so they take offline fixtures
# rather than a second and third Overpass query. Everything that *is* about the pipeline
# still reads the ingested tile, where a fixtured version would indeed have passed.
#
# ---------------------------------------------------------------------------------------
#
# **How production gets deployed, and why it looks like this.**
#
# The Vercel project is connected to this repository, so out of the box every push to
# `master` deployed straight to production whether or not the gates passed. That is a
# deployment mechanism, not a pipeline: the one thing a pipeline has to be able to do is
# refuse. So `apps/web/vercel.json` sets `git.deploymentEnabled.master: false`, which turns
# off the automatic production build, and the `deploy` job below triggers it instead — after
# `gates` is green, and only then. Pull requests keep their automatic preview deployments,
# because a preview is a throwaway URL nobody is relying on and having one to look at while
# reviewing is worth more than the purity.
#
# The trigger is a **deploy hook** rather than `vercel deploy --prod`, and that is forced
# rather than chosen. A CLI deploy needs a Vercel API token; Vercel refuses to mint one from
# a CLI-issued credential ("Cannot create tokens for this app"), so the only token that could
# go in `VERCEL_TOKEN` is one a human makes by hand in the dashboard. A deploy hook is a
# project-scoped URL that can be created through the API, which means this pipeline could be
# built end to end without leaving a manual step in the middle of it. The trade is that a
# hook is fire-and-forget: it returns a job id and tells you nothing further.
#
# The two settings do not collide, which is worth writing down because it looks like they
# should. `git.deploymentEnabled` gates deployments "upon commits" — the Git integration's
# push path, and nothing else. The setting that stops a hook firing is the deprecated
# `github.enabled: false`, which this project does not set and must not.
#
# A hook deploys the *tip of its branch* at the moment it is called, not the commit that
# called it. Two pushes in quick succession would therefore have the first job polling for a
# SHA the second one just replaced — which is why `cancel-in-progress` above is load-bearing
# rather than a nicety: the superseded run is cancelled before it can wait twenty minutes to
# fail at something that is not a defect.
#
# Hence `/api/version`. The job polls the production alias until it reports back the SHA that
# was pushed. That is a better check than the deployment record it replaces — it proves the
# build finished, the alias moved, *and* the app can serve a request, rather than proving a
# row somewhere reads READY.
#
# ---------------------------------------------------------------------------------------
#
# **Everything reaches master through a pull request**, and the `deploy` job is where that
# is enforced rather than merely intended. The obvious place would be a branch ruleset, but
# rulesets and branch protection need GitHub Pro on a private repository and this one is
# private on the free plan — so the rule would have been a note in a README that the next
# person in a hurry ignores. Refusing to deploy is enforcement the free plan cannot switch
# off: push straight to master and the gates still run, but nothing ships.
#
# That check needs `pull-requests: read` named explicitly on its job. This repository's
# default token permission is "read", which reads like it grants read everywhere and does
# not — it is GitHub's restricted default, `contents` and `packages` only. Asking for the
# pull requests of a commit without the scope returns 403 "Resource not accessible by
# integration", which is a sentence about permissions wearing the costume of a verdict.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # 04:11 UTC. Off the hour on purpose — every scheduled workflow on the platform fires at
    # :00, and the queue at that minute is where a five-minute job waits twenty.
    - cron: '11 4 * * *'
  workflow_dispatch:

# Keyed by event as well as ref, because the browser suite runs only on `schedule` or
# `workflow_dispatch` (see the note at the top) — so the one action that verifies Playwright was
# the one action that cancelled an in-flight deploy on the same ref. It happened: a dispatch two
# minutes after a merge killed that merge's `production schema` and `deploy production`, and left
# production a commit behind master.
#
# `cancel-in-progress` stays on for branches, where a superseded push is just wasted minutes, and
# off for master, where a cancelled run can abort `prisma db push` half-way through a schema change
# against the live database. Two master runs queueing is cheaper than one torn migration.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' }}

env:
  # A local throwaway database and a throwaway secret. Neither is a credential to anything.
  #
  # There is no `.env` file here and none is written. Every db script runs under
  # `dotenv -e ../../.env`, which is a no-op when the file is absent, and dotenv never
  # overrides a variable that is already set — so these pass straight through. The vitest
  # config reads the same way (`loadEnv` with an empty prefix merges `process.env` last).
  DATABASE_URL: postgresql://switchback:switchback@localhost:5433/switchback
  # Same endpoint. The two only diverge where a connection pooler sits in front of the database
  # and cannot carry DDL; `prisma db push` reads `directUrl` and fails on a missing variable,
  # not an equal one.
  DIRECT_DATABASE_URL: postgresql://switchback:switchback@localhost:5433/switchback
  AUTH_SECRET: ci-secret-not-used-for-anything-real-0123456789
  # Overpass refuses a client that will not say who it is, and rightly. A CI run that ever
  # reaches it should be identifiable and reachable.
  OVERPASS_USER_AGENT: 'switchback-ci/0.1 (+https://github.com/${{ github.repository }})'

jobs:
  gates:
    name: format · typecheck · lint · unit
    runs-on: ubuntu-latest

    env:
      # `eslint .` runs the type-aware rules, so it holds a TypeScript program for the whole
      # monorepo in memory at once. That peaks just under V8's default old-space cap on the
      # Node 22 this job pins, which puts it on the wrong side of the line as soon as a branch
      # adds files: the step aborts with "Reached heap limit" and exit 134. That reads like a
      # lint failure and is not one — it reports no rule and no file, and the same tree lints
      # clean under a larger cap. Nothing is relaxed here; `--max-warnings=0` still holds.
      # The pass is only given room to finish, on a runner with 16 GB to spare.
      NODE_OPTIONS: --max-old-space-size=4096

    services:
      db:
        # The same image infra/docker-compose.yml uses. Postgres 17 matches production; PostGIS
        # does not — production is Azure, which ships 3.6.1, and this is 3.5. That skew is
        # recorded rather than papered over. A CI database on plain Postgres would pass every
        # test that does not touch PostGIS and fail the ones that matter.
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: switchback
          POSTGRES_PASSWORD: switchback
          POSTGRES_DB: switchback
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U switchback -d switchback"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the engines floor in package.json, which is React Native 0.86's. With
          # engine-strict=true in .npmrc, a mismatch fails the install rather than Metro.
          node-version: 22
          cache: npm

      - run: npm ci

      # First, because it needs nothing else — no database, no generated client, no build.
      # A formatting failure that waits behind four minutes of Postgres and tsc is a
      # four-minute wait to be told about a missing newline.
      - run: npm run format:check

      # Explicit rather than trusting @prisma/client's postinstall to find the schema from
      # a hoisted workspace root. Everything downstream imports the generated types, so
      # skipping this fails typecheck with an error about the wrong thing entirely.
      - run: npm run db:generate

      # `push` also applies packages/db/prisma/spatial.sql — the indexes and the check
      # constraints Prisma cannot express live there, and half the db tests assert on them.
      - run: npm run db:push

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  browser:
    name: browser suite
    # Nightly and on demand only — see the note at the top of this file.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: switchback
          POSTGRES_PASSWORD: switchback
          POSTGRES_DB: switchback
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U switchback -d switchback"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:push

      # Creates the probe account the signed-in specs use, and queues the starter tiles.
      - run: npm run db:seed

      # Two trails the suite opens by slug that the one tile below does not contain — a gallery
      # whose photographs 404 on purpose, and a long route whose high point comes early enough
      # that the section's weather callouts fight for room. Both are offline fixtures under
      # reserved `fixture-` slugs; the script explains why they are invented rather than ingested.
      # Without this step three specs fail on every run regardless of the commit.
      - name: Seed the browser suite's fixtures
        run: npx tsx --env-file-if-exists=.env packages/db/scripts/seed-e2e.ts

      # The one Overpass query this workflow makes. Vesper Peak, because that is the sheet
      # every spec opens on — the reader's original report was "I search Vesper peak and get
      # nothing", and the suite was written to keep that fixed.
      - name: Ingest the Vesper Peak tile
        run: npm run ingest:tile -- --at 48.01213,-121.51188

      # The full Chromium build, not the headless shell: playwright.config.ts sets
      # `channel: 'chromium'` because MapLibre throws without a WebGL2 context and the shell
      # cannot give it one even with SwiftShader.
      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # ---------------------------------------------------------------------------------------
  # Production. Only ever reached from `master`, and only ever behind green gates.
  # ---------------------------------------------------------------------------------------

  migrate:
    name: production schema
    needs: gates
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Azure Postgres, from repository secrets — both were repointed from Neon at the
      # 2026-07-30 cutover. `schema.prisma` names the second as `directUrl`; on Azure's
      # Burstable tier there is no PgBouncer, so the two are the same 5432 endpoint today and
      # the split is what keeps DDL correct if the tier ever changes. Nothing else in this
      # workflow sees these; the two jobs above run against their own throwaway Postgres
      # service.
      #
      # This runs here rather than from a developer's machine for a boring, concrete reason:
      # a VPN that routes 5432 into a black hole is common enough, and the person who owns
      # this repository is behind one. A runner is not.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4
        with:
          # One commit of history, so the step below can ask what this push actually changed.
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # There are no migration files in this repository — `db push` reconciles the database
      # to `schema.prisma` — so there is no filename to key off and the question has to be
      # asked of the diff. Anything unreadable counts as changed: `db push` against a matching
      # schema is a few seconds and a no-op, and `spatial.sql` is written `IF NOT EXISTS`
      # throughout, so the cost of a false positive is nil and the cost of a false negative is
      # a deployment whose code expects a column that is not there.
      - name: Did the schema change?
        id: schema
        run: |
          if ! git rev-parse HEAD^ >/dev/null 2>&1; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "No previous commit to compare against — running the push."
            exit 0
          fi
          if git diff --name-only HEAD^ HEAD | grep -q '^packages/db/prisma/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --name-only HEAD^ HEAD | grep '^packages/db/prisma/' | sed 's/^/  /'
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No change under packages/db/prisma — leaving production alone."
          fi

      - if: steps.schema.outputs.changed == 'true'
        run: npm run db:generate

      # No `--accept-data-loss`, deliberately. Prisma refuses a destructive reconciliation
      # without it and cannot prompt in CI, so a change that would drop a column fails this
      # job — and therefore blocks the deploy — instead of quietly executing against the one
      # database with real data in it. Making that change is then a manual, deliberate act.
      - if: steps.schema.outputs.changed == 'true'
        run: npm run db:push

  deploy:
    name: deploy production
    needs: [gates, migrate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Naming any permission replaces the default set rather than adding to it, so `contents`
    # is restated even though nothing here checks out — a later step that does would
    # otherwise fail for a reason nobody would look for in this block.
    permissions:
      contents: read
      pull-requests: read

    # Shows up as a deployment on the commit, with a link, and gives somewhere to hang a
    # required reviewer later without touching this file.
    environment:
      name: production
      url: https://switchback-three.vercel.app

    steps:
      # The pull-request rule, enforced at the only point where enforcement is free.
      #
      # The association is queried rather than read off the commit message, because a squash
      # merge leaves a subject line indistinguishable from a direct commit — inferring it
      # from text would pass exactly the pushes it exists to catch. GitHub takes a moment to
      # index a freshly merged commit, so a single call would fail honest merges; hence the
      # retry.
      #
      # A failed *call* and an empty *answer* are kept apart, because the first version of
      # this step ran them together and refused its own merge commit: the API was returning
      # 403 for a missing scope and `|| echo 0` was reading that as "no pull request". A
      # check that cannot tell "you skipped review" from "I could not ask" is not a check,
      # so anything that is not a clean count now fails immediately and says which it was.
      # The unreadable-count branch is the same guard one layer down — an absent or unhappy
      # `jq` produces empty output, and empty compares as zero if you let it.
      - name: Refuse a commit that did not arrive through a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if ! body=$(gh api "repos/$REPO/commits/$SHA/pulls" 2>&1); then
              echo "::error::Could not ask GitHub which pull request this commit came from."
              echo "::error::This is not a verdict on the commit — the lookup itself failed:"
              printf '%s\n' "$body"
              exit 1
            fi

            count=$(printf '%s' "$body" | jq 'length' 2>&1)
            case "$count" in
              '' | *[!0-9]*)
                echo "::error::Could not count the pull requests GitHub returned."
                echo "::error::This is not a verdict on the commit — reading the reply failed:"
                printf '%s\n' "$count"
                exit 1
                ;;
            esac

            if [ "$count" -gt 0 ]; then
              printf '%s' "$body" | jq -r '.[] | "From #\(.number): \(.title)"'
              exit 0
            fi

            echo "attempt $attempt — GitHub reports no pull request for this commit yet"
            sleep 10
          done

          echo "::error::$SHA was pushed straight to master, so it will not be deployed."
          echo "::error::Branch it and open a pull request:"
          echo "::error::  git switch -c <branch> && git push -u origin <branch> && gh pr create"
          exit 1

      # A hook is a URL and the URL is the credential, so it is passed through the environment
      # rather than interpolated into the command line, where it would be visible to anything
      # reading the process table on the runner. GitHub masks it in the log either way.
      - name: Trigger the Vercel build
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK is not set. See the note at the top of this file."
            exit 1
          fi
          status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$DEPLOY_HOOK")
          echo "Deploy hook returned $status"
          [ "$status" = "201" ] || [ "$status" = "200" ]

      # The hook returns a job id and nothing else, so liveness is confirmed from the outside:
      # poll the production alias until it reports the commit that was just pushed. This is
      # deliberately end-to-end — it clears only when the build has finished, the alias has
      # moved, and the running app can answer a request.
      - name: Wait for the alias to serve this commit
        env:
          SITE: https://switchback-three.vercel.app
          SHA: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 90); do
            body=$(curl -fsS --max-time 20 "$SITE/api/version" 2>/dev/null || true)
            live=$(printf '%s' "$body" | jq -r '.commit // empty' 2>/dev/null || true)
            where=$(printf '%s' "$body" | jq -r '.environment // empty' 2>/dev/null || true)

            if [ "$live" = "$SHA" ] && [ "$where" = "production" ]; then
              echo "Live: $SHA"
              exit 0
            fi

            # Every tenth attempt, so a stuck deploy is diagnosable from the log without the
            # log being ninety lines of the same sentence.
            if [ $((attempt % 10)) -eq 1 ]; then
              echo "attempt $attempt — serving ${live:-<nothing>} (${where:-unknown}), want $SHA"
            fi
            sleep 10
          done

          echo "::error::The production alias never reported $SHA. The build may have failed —"
          echo "::error::check the Vercel dashboard for this project."
          exit 1

      # A smoke test, because "the alias moved" and "the site works" are different claims and
      # only one of them has been proven so far. These six are the load-bearing routes: the
      # map that is now the front page, the alias every shared link still carries, the list of
      # trails near the reader, a trail read out of Postgres, the attribution ODbL requires,
      # and the manifest without which none of it installs.
      #
      # No `-L`, deliberately. `%{http_code}` reports the first response, so a redirect anywhere
      # in this list fails the job — which is the point: `/explore` must serve the sheet itself
      # rather than bounce a shared link through an extra round trip.
      - name: Smoke-test the live site
        env:
          SITE: https://switchback-three.vercel.app
        run: |
          failed=0
          for path in / /explore /nearby /trails/llanberis-path /attribution /manifest.webmanifest; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$SITE$path" || echo 000)
            printf '%s  %s\n' "$status" "$path"
            [ "$status" = "200" ] || failed=1
          done
          [ "$failed" -eq 0 ] || {
            echo "::error::A production route did not return 200."
            exit 1
          }
